<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizador 3D - Escudo Medieval</title>
  
  <!-- Importar la librería model-viewer de Google v3.3.0 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  
  <style>
    /* Diseño general y tipografía moderna */
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    
    h1 {
      font-weight: 300;
      letter-spacing: 1.5px;
      margin-bottom: 30px;
      color: #ffffff;
    }

    /* Contenedor principal para centrar y dar estructura */
    .contenedor-principal {
      max-width: 900px;
      margin: 0 auto;
    }
    
    /* Estilos del visor 3D */
    model-viewer {
      display: block; 
      width: 100%;
      height: 60vh;
      background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
      margin-bottom: 25px;
    }
    
    /* Panel moderno para los controles */
    .panel-controles {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2c2c2c;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    /* Estilo de los botones interactivos */
    button {
      flex: 1;
      min-width: 220px;
      padding: 14px 20px;
      background-color: #252525;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    /* Efecto al pasar el ratón */
    button:hover { 
      background-color: #333; 
      border-color: #666;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Efecto al hacer clic */
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="contenedor-principal">
    <h1>Configurador de Escudo</h1>
    
    <!-- Visor 3D -->
    <model-viewer 
      id="mi-escudo" 
      src="escudo.glb" 
      alt="Modelo 3D interactivo de un escudo medieval"
      camera-controls 
      auto-rotate 
      ar
      shadow-intensity="1"
      touch-action="pan-y"
      bounds="tight">
    </model-viewer>

    <!-- Panel de Controles -->
    <div class="panel-controles">
      <button id="btn-logo">🛡️ Emblema: <b>Amarillo/Negro</b></button>
      <button id="btn-contorno">⚔️ Contorno: <b>Acero</b></button>
      <button id="btn-desgaste">✨ Acabado: <b>Desgastado</b></button>
    </div>
  </div>

  <script>
    const modelViewer = document.querySelector('#mi-escudo');

    modelViewer.addEventListener('load', () => {
      
      const materialLogo = modelViewer.model.getMaterialByName('logo_Amarillo'); 
      const materialContorno = modelViewer.model.getMaterialByName('Metal');

      // --- BOTÓN 1: CAMBIAR LA TEXTURA DEL EMBLEMA ---
      let esLogoAmarillo = true;
      document.querySelector('#btn-logo').addEventListener('click', async () => {
        if (!materialLogo) return alert("No se encontró el material del logo.");
        
        if (esLogoAmarillo) {
          const texturaAzul = await modelViewer.createTexture('textura_azul.png');
          materialLogo.pbrMetallicRoughness.baseColorTexture.setTexture(texturaAzul);
          document.querySelector('#btn-logo').innerHTML = "🛡️ Emblema: <b>Rojo/Azul</b>";
          esLogoAmarillo = false;
        } else {
          const texturaAmarilla = await modelViewer.createTexture('textura_amarilla.png');
          materialLogo.pbrMetallicRoughness.baseColorTexture.setTexture(texturaAmarilla);
          document.querySelector('#btn-logo').innerHTML = "🛡️ Emblema: <b>Amarillo/Negro</b>";
          esLogoAmarillo = true;
        }
      });

      // --- BOTÓN 2: CAMBIAR EL CONTORNO (METAL A BRONCE) ---
      let esBronce = false;
      document.querySelector('#btn-contorno').addEventListener('click', () => {
        if (!materialContorno) return alert("No se encontró el material Metal.");
        
        if (!esBronce) {
          materialContorno.pbrMetallicRoughness.setBaseColorFactor([0.8, 0.4, 0.1, 1]); 
          document.querySelector('#btn-contorno').innerHTML = "⚔️ Contorno: <b>Bronce</b>";
          esBronce = true;
        } else {
          materialContorno.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]); 
          document.querySelector('#btn-contorno').innerHTML = "⚔️ Contorno: <b>Acero</b>";
          esBronce = false;
        }
      });

      // --- BOTÓN 3: ALTERNAR DESGASTE (ROUGHNESS) ---
      let estaDesgastado = true;
      document.querySelector('#btn-desgaste').addEventListener('click', () => {
        if (!materialContorno) return;

        if (estaDesgastado) {
          materialContorno.pbrMetallicRoughness.setRoughnessFactor(0.2);
          document.querySelector('#btn-desgaste').innerHTML = "✨ Acabado: <b>Pulido</b>";
          estaDesgastado = false;
        } else {
          materialContorno.pbrMetallicRoughness.setRoughnessFactor(0.8);
          document.querySelector('#btn-desgaste').innerHTML = "✨ Acabado: <b>Desgastado</b>";
          estaDesgastado = true;
        }
      });

    });
  </script>

</body>
</html>
